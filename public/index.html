<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataLab</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="bg-drift" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <div id="app" class="app">
      <!-- ============ Top bar (brand · cycling accomplishments · hours) ============ -->
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="assets/datalab-logo.png" alt="DataLab" />
          <div class="brand-text">
            <span class="brand-mark">Data<span class="brand-accent">Lab</span></span>
            <span class="brand-sub">UC&nbsp;Davis&nbsp;·&nbsp;Data Science for Discovery</span>
          </div>
        </div>

        <div class="statcycle" id="statcycle" aria-label="At a glance"></div>

        <div class="topbar-right">
          <div class="hours-block" id="hours-block" data-status="unknown">
            <span class="hours-key" aria-hidden="true"></span>
            <div id="hours-text" class="hours-text">Shields Library</div>
          </div>
          <div class="clock">
            <div id="clock-time" class="clock-time">--:--</div>
            <div id="clock-date" class="clock-date">&nbsp;</div>
          </div>
        </div>
      </header>

      <!-- Closing-soon banner -->
      <div id="closing-banner" class="closing-banner" hidden>
        <span class="closing-dot" aria-hidden="true"></span>
        <span id="closing-banner-text">Shields Library closes soon</span>
      </div>

      <!-- ============ Featured project ============ -->
      <section class="featured-wrap" aria-label="Featured project">
        <div class="tier-head">
          <span class="tier-label">Featured Project</span>
        </div>
        <article id="featured" class="featured"></article>
      </section>

      <!-- ============ Active Projects board (paged) ============ -->
      <section class="board-wrap" aria-label="Active projects">
        <div class="tier-head">
          <span class="tier-label">Active Projects</span>
          <span id="board-count" class="tier-sub"></span>
          <span id="board-pages" class="board-pages"></span>
        </div>
        <div class="board-grid board-header">
          <span>Project</span><span>Lead</span><span>Partner</span><span>Focus</span><span>Since</span>
        </div>
        <div id="board" class="board"></div>
      </section>

      <!-- ============ Workshops / Past work (compact) ============ -->
      <section class="rail-wrap" aria-label="Workshops and past work">
        <div class="rail-inner">
          <span id="rail-label" class="rail-label">Past Projects</span>
          <ul id="workshop-list" class="workshop-list" hidden></ul>
          <div id="pastwork" class="pastwork" hidden>
            <div id="pp-feature" class="pp-feature"></div>
          </div>
        </div>
      </section>

      <div id="conn" class="conn" hidden><span class="conn-dot"></span> reconnecting</div>
    </div>

    <!-- Hidden test-mode hotspot + menu (bottom-right corner) -->
    <div id="test-toggle" title="Test mode"></div>
    <div id="test-menu" class="test-menu" hidden>
      <div class="tm-head">Test Mode</div>
      <div class="tm-group">
        <div class="tm-label">Library status</div>
        <div class="tm-row" id="tm-mode">
          <button data-mode="live" class="on">Live</button>
          <button data-mode="open">Open</button>
          <button data-mode="closing">Closing soon</button>
          <button data-mode="closed">Closed</button>
        </div>
      </div>
      <div class="tm-group">
        <div class="tm-label">Workshops</div>
        <div class="tm-row" id="tm-ws">
          <button data-ws="live" class="on">Real</button>
          <button data-ws="fake">Fake sample</button>
        </div>
      </div>
      <div class="tm-actions">
        <button id="tm-chime">Test closing chime</button>
        <button id="tm-close">Close</button>
      </div>
    </div>

    <!-- Full-screen CLOSED takeover -->
    <div id="closed-overlay" class="closed-overlay" hidden>
      <div class="closed-inner">
        <div class="closed-lib-name">Shields Library</div>
        <div class="closed-big">CLOSED</div>
        <div id="closed-sub" class="closed-sub"></div>
        <div id="closed-clock" class="closed-clock"></div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
